<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Outlet Finder & Tracker</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <style>
        body{font-family:Arial,sans-serif;margin:10px;background:#f4f7f6}
        .box{background:white;padding:15px;border-radius:12px;box-shadow:0 4px 15px rgba(0,0,0,0.1);margin-bottom:20px}
        #status-bar{background:#1a73e8;color:white;padding:12px;border-radius:8px;margin-bottom:15px;text-align:center;font-weight:bold;font-size:14px}
        input{padding:12px;width:92%;margin-bottom:10px;border:1px solid #ccc;border-radius:6px;font-size:16px;display:block}
        button{padding:12px;cursor:pointer;border-radius:6px;border:none;background:#1a73e8;color:white;font-weight:bold;width:100%;margin-bottom:10px;font-size:16px}
        #map{height:300px;width:100%;border-radius:10px;border:1px solid #ddd;margin-top:15px}
        ul{list-style:none;padding:0}
        li{background:#fff;padding:15px;border-left:5px solid #1a73e8;margin-bottom:10px;border-radius:4px;box-shadow:0 2px 5px rgba(0,0,0,0.05)}
        .name{font-weight:bold;font-size:16px;color:#1a73e8}
        .address{font-size:13px;color:#555;margin:5px 0}
        .distance{font-weight:bold;color:#28a745;font-size:14px}
        .map-link{display:block;text-align:center;background:#e8f0fe;color:#1a73e8;text-decoration:none;padding:10px;border-radius:4px;margin-top:10px;font-weight:bold}
        #mapBtn, #routeBtn {display:none; background:#34a853}
    </style>
</head>
<body>

<div id="status-bar">🛰️ Online | ID: <span id="uid">...</span></div>

<div class="box">
    <input type="text" id="ids" placeholder="Enter Outlet IDs (e.g. 101, 102)" onkeypress="if(event.key==='Enter') findOutlets()">
    <button id="findBtn" onclick="findOutlets()">Find Outlets</button>
    <button id="mapBtn" onclick="showAllOnMap()">Show All on Map</button>
    <button id="routeBtn" onclick="openFullRoute()">Start Full Route</button>
    <ul id="result"></ul>
    <div id="map"></div>
</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbybvqYl4yMZqoHHlqDeeFObY97vtpPS2ClSINlogyEZIzCMpEa946BDkNZfwJqlNT4G/exec";
const SHEET_ID = "1u7RN-0d34sy01gXlJjc16C-ZTOdsQPj94X9NXSWabqo";
const urlParams = new URLSearchParams(window.location.search);
const empId = urlParams.get("id");

if(!empId) {
    alert("Invalid Session");
} else {
    document.getElementById("uid").innerText = empId;
    // Mobile Background Tracking
    setInterval(() => {
        navigator.geolocation.getCurrentPosition(pos => {
            fetch(`${API}?id=${encodeURIComponent(empId)}&lat=${pos.coords.latitude}&lng=${pos.coords.longitude}`);
        }, null, {enableHighAccuracy:true, timeout:10000});
    }, 20000);
}

let outletsData = [], map;

async function findOutlets() {
    const btn = document.getElementById("findBtn");
    btn.innerText = "Searching...";
    try {
        const inputIds = document.getElementById("ids").value.split(/[\s,]+/).map(x=>x.trim()).filter(x=>x!=="");
        const res = await fetch(`https://opensheet.elk.sh/${SHEET_ID}/location`);
        const data = await res.json();

        const filtered = [];
        inputIds.forEach(id => {
            const found = data.find(d => String(d["Outlet Id"]) === id);
            if (found) filtered.push(found);
        });

        if (!filtered.length) { alert("No Outlets Found"); btn.innerText="Find Outlets"; return; }

        navigator.geolocation.getCurrentPosition(pos => {
            renderResults(filtered, pos.coords.latitude, pos.coords.longitude);
            btn.innerText = "Find Outlets";
        }, () => {
            alert("Enable GPS for Distance");
            renderResults(filtered, null, null);
            btn.innerText = "Find Outlets";
        });
    } catch(e) { alert("Error loading data"); btn.innerText="Find Outlets"; }
}

function renderResults(filtered, uLat, uLon) {
    const ul = document.getElementById("result");
    ul.innerHTML = "";
    outletsData = [];
    let pLat = uLat, pLon = uLon;

    filtered.forEach((o, i) => {
        const lat = parseFloat(o.Latitude), lon = parseFloat(o.Longitude);
        let dText = "N/A";
        if(pLat && pLon) {
            const d = getDist(pLat, pLon, lat, lon);
            dText = d.toFixed(2) + " km " + (i===0 ? "(From You)" : "(Next)");
        }
        const li = document.createElement("li");
        li.innerHTML = `<div class="name">${o["Outlet Name"]}</div><div class="address">${o["Address"]||""}</div><div class="distance">📍 ${dText}</div><a href="https://www.google.com/maps?q=${lat},${lon}" target="_blank" class="map-link">Open Maps</a>`;
        ul.appendChild(li);
        pLat = lat; pLon = lon;
        outletsData.push({name: o["Outlet Name"], lat, lon});
    });
    document.getElementById("mapBtn").style.display = "block";
    document.getElementById("routeBtn").style.display = "block";
}

function getDist(l1, n1, l2, n2) {
    const R = 6371;
    const dL = (l2-l1)*Math.PI/180, dN = (n2-n1)*Math.PI/180;
    const a = Math.sin(dL/2)**2 + Math.cos(l1*Math.PI/180)*Math.cos(l2*Math.PI/180)*Math.sin(dN/2)**2;
    return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function showAllOnMap() {
    navigator.geolocation.getCurrentPosition(pos => {
        if(!map) {
            map = L.map('map').setView([pos.coords.latitude, pos.coords.longitude], 12);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        }
        outletsData.forEach(o => {
            L.marker([o.lat, o.lon]).addTo(map).bindTooltip(o.name, {permanent:true, direction:"top"}).openTooltip();
        });
        map.fitBounds(outletsData.map(o => [o.lat, o.lon]));
    });
}

function openFullRoute() {
    navigator.geolocation.getCurrentPosition(pos => {
        let pts = [`${pos.coords.latitude},${pos.coords.longitude}`];
        outletsData.forEach(o => pts.push(`${o.lat},${o.lon}`));
        window.open("https://www.google.com/maps/dir/" + pts.join("/"), "_blank");
    });
}
</script>
</body>
</html>
