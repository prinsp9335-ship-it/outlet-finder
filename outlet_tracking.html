<!DOCTYPE html>
<html>
<head>
<title>Outlet Finder</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<style>
body{font-family:Arial;margin:20px}
.container{display:flex;gap:40px;align-items:flex-start}
.box{flex:1}
input{padding:8px;width:80%;margin-bottom:10px}
button{padding:8px 15px;cursor:pointer;margin-top:5px}
ul{list-style:none;padding:0}
li{margin-bottom:15px;padding:12px;border:1px solid #ccc;border-radius:6px;line-height:1.6}
.name{font-weight:bold;margin-bottom:6px}
.address{font-size:14px;color:#555;margin-bottom:6px}
.distance{margin:6px 0}
#map{height:400px;margin-top:20px}
#mapBtn,#routeBtn{display:none;margin-right:10px}
#status{background:#d4edda;color:#155724;padding:10px;border-radius:5px;margin-bottom:10px;font-weight:bold}
</style>
</head>
<body>
<div id="status">Tracking Active (ID: <span id="uid"></span>)</div>
<div class="container">
<div class="box">
<h2>Find Outlets</h2>
<input type="text" id="ids" placeholder="Enter Outlet IDs">
<button onclick="findOutlets()">Find</button>
<button id="mapBtn" onclick="showAllOnMap()">Show All on Map</button>
<button id="routeBtn" onclick="openFullRoute()">Start Full Route</button>
<ul id="result"></ul>
<div id="map"></div>
</div>
</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbx3KmYOfcic1WoEHGA_euXyef31Lrr47N_RGeDkztjZIb-WSqxkQ7-q5y726hGOteEp/exec";
const SHEET_ID="1u7RN-0d34sy01gXlJjc16C-ZTOdsQPj94X9NXSWabqo";
const urlParams = new URLSearchParams(window.location.search);
const empId = urlParams.get("id");

if(!empId || empId === "null") {
    alert("Session Error! Please login again.");
    window.location.href = "index.html";
} else {
    document.getElementById("uid").innerText = empId;
    // Har 15 second mein tracking
    setInterval(() => {
        navigator.geolocation.getCurrentPosition(pos => {
            fetch(`${API}?id=${encodeURIComponent(empId)}&lat=${pos.coords.latitude}&lng=${pos.coords.longitude}`);
        });
    }, 15000);
}

// --- AAPKA ORIGINAL CODE START ---
let outletsData=[],map;
function initMap(lat,lon){map=L.map('map').setView([lat,lon],12);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'OpenStreetMap'}).addTo(map);L.marker([lat,lon]).addTo(map).bindPopup("📍 Your Location").openPopup()}
function showAllOnMap(){navigator.geolocation.getCurrentPosition(pos=>{const lat=pos.coords.latitude,lon=pos.coords.longitude;if(!map)initMap(lat,lon);drawMarkers()})}
function drawMarkers(){outletsData.forEach(o=>{if(o.Latitude&&o.Longitude){const marker=L.marker([o.Latitude,o.Longitude]).addTo(map).bindTooltip(o.name,{permanent:true,direction:"top",offset:[0,-10]});marker.on('click',()=>{window.open(`https://www.google.com/maps?q=${o.Latitude},${o.Longitude}`,"_blank")})}})}
function openFullRoute(){navigator.geolocation.getCurrentPosition(pos=>{let points=[`${pos.coords.latitude},${pos.coords.longitude}`];outletsData.forEach(o=>points.push(`${o.Latitude},${o.Longitude}`));window.open("https://www.google.com/maps/dir/"+points.join("/"),"_blank")})}
async function findOutlets(){try{const ids=document.getElementById("ids").value.split(/[\s,]+/).map(x=>x.trim()).filter(x=>x!=="");const res=await fetch(`https://opensheet.elk.sh/${SHEET_ID}/location`);const data=await res.json();const filtered=data.filter(d=>ids.includes(String(d["Outlet Id"])));if(!filtered.length){alert("No matching Outlet IDs found");return}navigator.geolocation.getCurrentPosition(pos=>{const userLat=pos.coords.latitude,userLon=pos.coords.longitude;function getDistance(lat1,lon1,lat2,lon2){const R=6371,dLat=(lat2-lat1)*Math.PI/180,dLon=(lon2-lon1)*Math.PI/180,a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;return 2*R*Math.atan2(Math.sqrt(a),Math.sqrt(1-a))}const result=[];let prevLat=userLat,prevLon=userLon;for(let o of filtered){const lat=parseFloat(o.Latitude),lon=parseFloat(o.Longitude),dist=getDistance(prevLat,prevLon,lat,lon);result.push({name:o["Outlet Name"],address:o["Address"],Latitude:lat,Longitude:lon,link:o["Location"],distance:dist});prevLat=lat;prevLon=lon}outletsData=result;const ul=document.getElementById("result");ul.innerHTML="";result.forEach(r=>{const li=document.createElement("li");li.innerHTML=`<div class="name">${r.name}</div><div class="address">${r.address||"No address"}</div><div class="distance">Distance: ${r.distance.toFixed(2)} km</div><a href="${r.link}" target="_blank">Open Location</a>`;ul.appendChild(li)});document.getElementById("mapBtn").style.display="inline-block";document.getElementById("routeBtn").style.display="inline-block"})}catch(e){console.log(e);alert("Error loading data")}}
// --- AAPKA ORIGINAL CODE END ---
</script>
</body>
</html>
