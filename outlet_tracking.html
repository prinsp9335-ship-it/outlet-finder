<!DOCTYPE html>
<html>
<head>
<title>Outlet Finder & Tracker</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<style>
    body{font-family:Arial;margin:20px;background:#f4f7f6}
    .container{display:flex;gap:30px;flex-direction:column}
    .box{background:white;padding:25px;border-radius:12px;box-shadow:0 4px 15px rgba(0,0,0,0.1)}
    #status-bar{background:#1a73e8;color:white;padding:12px;border-radius:8px;margin-bottom:15px;text-align:center;font-weight:bold}
    input{padding:12px;width:85%;margin-bottom:15px;border:1px solid #ccc;border-radius:6px;font-size:16px}
    button{padding:12px 20px;cursor:pointer;border-radius:6px;border:none;background:#1a73e8;color:white;font-weight:bold;margin-right:10px}
    button:hover{background:#1557b0}
    #map{height:400px;margin-top:20px;border-radius:10px;border:1px solid #ddd}
    ul{list-style:none;padding:0;margin-top:20px}
    li{background:#fff;padding:15px;border-left:5px solid #1a73e8;margin-bottom:15px;border-radius:4px;box-shadow:0 2px 5px rgba(0,0,0,0.05)}
    .name{font-weight:bold;font-size:18px;color:#1a73e8;margin-bottom:5px}
    .address{font-size:14px;color:#555;margin-bottom:8px}
    .distance{font-weight:bold;color:#28a745;margin-bottom:10px}
    .map-link{display:inline-block;color:#1a73e8;text-decoration:none;font-weight:bold;border:1px solid #1a73e8;padding:5px 10px;border-radius:4px}
    #mapBtn,#routeBtn{display:none;background:#34a853}
</style></head><body><div id="status-bar">🛰️ Online Tracking | User ID: <span id="uid">...</span></div>
<div class="container"><div class="box"><h2>Find Outlets</h2><input type="text" id="ids" placeholder="Enter Outlet IDs (e.g., 101, 102, 103)"><br><button onclick="findOutlets()">Find Outlets</button><button id="mapBtn" onclick="showAllOnMap()">Show All on Map</button><button id="routeBtn" onclick="openFullRoute()">Start Full Route</button>
        <ul id="result"></ul><div id="map"></div></div></div><script>
const API = "https://script.google.com/macros/s/AKfycbx3KmYOfcic1WoEHGA_euXyef31Lrr47N_RGeDkztjZIb-WSqxkQ7-q5y726hGOteEp/exec";
const SHEET_ID = "1u7RN-0d34sy01gXlJjc16C-ZTOdsQPj94X9NXSWabqo";
const urlParams = new URLSearchParams(window.location.search);
const empId = urlParams.get("id");
if(!empId || empId === "null") {
    alert("Session Expired. Please Login Again.");
    window.location.href = "index.html";
} else {
document.getElementById("uid").innerText = empId;
    setInterval(() => {
        navigator.geolocation.getCurrentPosition(pos => {
            fetch(`${API}?id=${encodeURIComponent(empId)}&lat=${pos.coords.latitude}&lng=${pos.coords.longitude}`);
        }, null, {enableHighAccuracy:true});
    }, 15000);
}
let outletsData = [], map;
function initMap(lat, lon) {
    if (map) return;
    map = L.map('map').setView([lat, lon], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    L.marker([lat, lon]).addTo(map).bindPopup("📍 Current Location").openPopup();
}
function showAllOnMap() {
    navigator.geolocation.getCurrentPosition(pos => {
        initMap(pos.coords.latitude, pos.coords.longitude);
        drawMarkers();
    });
}
function drawMarkers() {
    outletsData.forEach(o => {
        if (o.Latitude && o.Longitude) {
            // Label ab hamesha TOP par dikhega
            const marker = L.marker([o.Latitude, o.Longitude]).addTo(map)
                .bindTooltip(o.name, {permanent: true, direction: "top", offset: [0, -10]});
            
            marker.on('click', () => {
                window.open(`https://www.google.com/maps?q=${o.Latitude},${o.Longitude}`, "_blank");
            });}});}
function openFullRoute() {
    navigator.geolocation.getCurrentPosition(pos => {
        let points = [`${pos.coords.latitude},${pos.coords.longitude}`];
        outletsData.forEach(o => points.push(`${o.Latitude},${o.Longitude}`));
        window.open("https://www.google.com/maps/dir/" + points.join("/"), "_blank");
    });}
async function findOutlets() {try {const inputIds = document.getElementById("ids").value.split(/[\s,]+/).map(x => x.trim()).filter(x => x !== "");
        if (inputIds.length === 0) return alert("Please enter Outlet IDs");
        const res = await fetch(`https://opensheet.elk.sh/${SHEET_ID}/location`);
        const data = await res.json();
        const filtered = [];
        inputIds.forEach(id => {
            const found = data.find(d => String(d["Outlet Id"]) === id);
            if (found) filtered.push(found); });
        if (!filtered.length) return alert("No matching Outlets found");
        navigator.geolocation.getCurrentPosition(pos => {
            const userLat = pos.coords.latitude;
            const userLon = pos.coords.longitude;
            function getDistance(lat1, lon1, lat2, lon2) {
                const R = 6371;
                const dLat = (lat2 - lat1) * Math.PI / 180;
                const dLon = (lon2 - lon1) * Math.PI / 180;
                const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon / 2) ** 2;
                return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));            }
            const result = [];
            let prevLat = userLat;
            let prevLon = userLon;
            filtered.forEach((o, index) => {
                const lat = parseFloat(o.Latitude);
                const lon = parseFloat(o.Longitude);
                const dist = getDistance(prevLat, prevLon, lat, lon);
                result.push({
                    name: o["Outlet Name"],
                    address: o["Address"],
                    Latitude: lat,
                    Longitude: lon,
                    link: o["Location"] || `https://www.google.com/maps?q=${lat},${lon}`,
                    distance: dist,
                    type: index === 0 ? "From You" : "From Last Stop"
                });prevLat = lat;
                prevLon = lon; });
            outletsData = result;
            const ul = document.getElementById("result");
            ul.innerHTML = "";
            result.forEach(r => {
                const li = document.createElement("li");
                li.innerHTML = `
                    <div class="name">${r.name}</div>
                    <div class="address">${r.address || "Address not available"}</div>
                    <div class="distance">📍 ${r.distance.toFixed(2)} km (${r.type})</div>
                    <a href="${r.link}" target="_blank" class="map-link">🚀 Open in Google Maps</a>
                `; ul.appendChild(li);
            }); document.getElementById("mapBtn").style.display = "inline-block";
            document.getElementById("routeBtn").style.display = "inline-block";
        }); } catch (e) {
        alert("Error loading data. Check Internet or Sheet ID.");    }}
</script>
</body>
</html>
