<!DOCTYPE html>
<html>
<head>
    <title>Employee Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f0f2f5; }
        .login-card { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 300px; text-align: center; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #1a73e8; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        #error { color: red; font-size: 14px; margin-top: 10px; }
    </style>
</head>
<body>
<div class="login-card">
    <h2>Emp Login</h2>
    <input type="text" id="empId" placeholder="User ID">
    <input type="password" id="password" placeholder="Password">
    <button onclick="login()">Login</button>
    <p id="error"></p>
</div>
<script>
    const API = "https://script.google.com/macros/s/AKfycbx3KmYOfcic1WoEHGA_euXyef31Lrr47N_RGeDkztjZIb-WSqxkQ7-q5y726hGOteEp/exec";
    async function login() {
        const id = document.getElementById("empId").value.trim();
        const pass = document.getElementById("password").value.trim();
        const res = await fetch(`${API}?action=login&id=${encodeURIComponent(id)}&pass=${encodeURIComponent(pass)}`);
        const status = await res.text();
        if (status.trim() === "success") {
            window.location.href = "outlet_tracking.html?id=" + encodeURIComponent(id);
        } else {
            document.getElementById("error").innerText = "Invalid ID or Password";
        }
    }
</script>
</body>
</html>
