<!DOCTYPE html>
<html>
<head>
  <title>Outlet Finder</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <style>
    body { font-family: Arial; margin: 20px; }

    .container {
      display: flex;
      gap: 40px;
    }

    .box { flex: 1; }

    input {
      padding: 8px;
      width: 80%;
      margin-bottom: 10px;
    }

    button {
      padding: 8px 15px;
      cursor: pointer;
      margin-top: 5px;
    }

    ul { list-style: none; padding: 0; }

    li {
      margin-bottom: 12px;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    .name { font-weight: bold; }
    .address { font-size: 13px; color: #555; }
    .distance { margin-top: 5px; }

    #map {
      height: 400px;
      margin-top: 20px;
    }

    #mapBtn, #routeBtn {
      display: none;
      margin-right: 10px;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="box">
    <h2>Find Outlets</h2>

    <input type="text" id="ids" placeholder="Enter Outlet IDs">
    <button onclick="findOutlets()">Find</button>

    <button id="mapBtn" onclick="showAllOnMap()">Show All on Map</button>
    <button id="routeBtn" onclick="openFullRoute()">Start Full Route</button>

    <ul id="result"></ul>

    <div id="map"></div>
  </div>

</div>

<script>

const SHEET_ID = "1u7RN-0d34sy01gXlJjc16C-ZTOdsQPj94X9NXSWabqo";

let outletsData = [];
let map;

// ---------------- MAP INIT ----------------
function initMap(lat, lon) {
  map = L.map('map').setView([lat, lon], 12);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: 'OpenStreetMap'
  }).addTo(map);

  L.marker([lat, lon])
    .addTo(map)
    .bindPopup("📍 Your Location")
    .openPopup();
}

// ---------------- SHOW MAP ----------------
function showAllOnMap() {

  navigator.geolocation.getCurrentPosition(pos => {

    const lat = pos.coords.latitude;
    const lon = pos.coords.longitude;

    if (!map) initMap(lat, lon);

    outletsData.forEach(o => {

      const marker = L.marker([o.Latitude, o.Longitude])
        .addTo(map)
        .bindTooltip(o.name, { permanent: true });

      marker.on('click', () => {
        window.open(`https://www.google.com/maps?q=${o.Latitude},${o.Longitude}`, "_blank");
      });
    });

  });
}

// ---------------- FULL ROUTE (CHAIN LOGIC) ----------------
function openFullRoute() {

  navigator.geolocation.getCurrentPosition(pos => {

    let prevLat = pos.coords.latitude;
    let prevLon = pos.coords.longitude;

    let total = 0;

    let googleRoute = [];
    googleRoute.push(`${prevLat},${prevLon}`);

    let msg = "ROUTE DETAILS:\n\n";

    outletsData.forEach((o, i) => {

      const lat = o.Latitude;
      const lon = o.Longitude;

      const R = 6371;
      const dLat = (lat - prevLat) * Math.PI/180;
      const dLon = (lon - prevLon) * Math.PI/180;

      const a =
        Math.sin(dLat/2)**2 +
        Math.cos(prevLat*Math.PI/180) *
        Math.cos(lat*Math.PI/180) *
        Math.sin(dLon/2)**2;

      const dist = 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));

      total += dist;

      msg += `Step ${i+1}: ${o.name}\nDistance from previous: ${dist.toFixed(2)} km\n\n`;

      prevLat = lat;
      prevLon = lon;

      googleRoute.push(`${lat},${lon}`);
    });

    msg += `TOTAL DISTANCE: ${total.toFixed(2)} km`;

    alert(msg);

    const url = "https://www.google.com/maps/dir/" + googleRoute.join("/");
    window.open(url, "_blank");

  });
}

// ---------------- MAIN FUNCTION ----------------
async function findOutlets() {

  const ids = document.getElementById("ids").value
    .split(/[\s,]+/)
    .map(x => x.trim())
    .filter(x => x);

  const res = await fetch(`https://opensheet.elk.sh/${SHEET_ID}/location`);
  const data = await res.json();

  const filtered = data.filter(d =>
    ids.includes(String(d["Outlet Id"]))
  );

  navigator.geolocation.getCurrentPosition(pos => {

    const userLat = pos.coords.latitude;
    const userLon = pos.coords.longitude;

    function getDistance(aLat, aLon, bLat, bLon) {
      const R = 6371;
      const dLat = (bLat - aLat) * Math.PI/180;
      const dLon = (bLon - aLon) * Math.PI/180;

      const x =
        Math.sin(dLat/2)**2 +
        Math.cos(aLat*Math.PI/180) *
        Math.cos(bLat*Math.PI/180) *
        Math.sin(dLon/2)**2;

      return 2 * R * Math.atan2(Math.sqrt(x), Math.sqrt(1-x));
    }

    let result = [];
    let prevLat = userLat;
    let prevLon = userLon;

    for (let o of filtered) {

      const lat = parseFloat(o.Latitude);
      const lon = parseFloat(o.Longitude);

      const dist = getDistance(prevLat, prevLon, lat, lon);

      result.push({
        name: o["Outlet Name"],
        address: o["Address"],
        Latitude: lat,
        Longitude: lon,
        link: o["Location"],
        distance: dist
      });

      prevLat = lat;
      prevLon = lon;
    }

    outletsData = result;

    const ul = document.getElementById("result");
    ul.innerHTML = "";

    result.forEach(r => {
      ul.innerHTML += `
        <li>
          <div class="name">${r.name}</div>
          <div class="address">${r.address || ""}</div>
          <div class="distance">${r.distance.toFixed(2)} km</div>
        </li>
      `;
    });

    document.getElementById("mapBtn").style.display = "inline-block";
    document.getElementById("routeBtn").style.display = "inline-block";

  });

}

</script>

</body>
</html>
