<!DOCTYPE html>
<html>
<head>
  <title>Outlet Finder</title>

  <style>
    body { font-family: Arial; margin: 20px; }

    .container {
      display: flex;
      gap: 40px;
      align-items: flex-start;
    }

    .box { flex: 1; }

    input {
      padding: 8px;
      width: 80%;
      margin-bottom: 10px;
    }

    button {
      padding: 8px 15px;
      cursor: pointer;
    }

    ul { list-style: none; padding: 0; }

    li {
      margin-bottom: 15px;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      line-height: 1.6;
    }

    .name { font-weight: bold; margin-bottom: 6px; }
    .address { font-size: 14px; color: #555; margin-bottom: 6px; }
    .distance { margin: 6px 0; }

  </style>
</head>

<body>

<div class="container">

  <!-- LEFT -->
  <div class="box">
    <h2>Find Nearest Outlets</h2>

    <input type="text" id="ids" placeholder="Enter Outlet IDs">
    <button onclick="findOutlets()">Find</button>

    <ul id="result"></ul>
  </div>

  <!-- RIGHT -->
  <div class="box">
    <h2>Enter Outlet ID</h2>

    <input type="text" id="outletId" placeholder="Enter 6 digit Outlet ID">
    <button onclick="checkId()">Submit</button>

    <p id="error" style="color:red;"></p>
  </div>

</div>

<script>

function checkId() {
  let id = document.getElementById("outletId").value;

  if (!/^\d{6}$/.test(id)) {
    document.getElementById("error").innerText = "Enter valid 6 digit ID";
    return;
  }

  window.location.href = "result.html?id=" + id;
}

const SHEET_ID = "1u7RN-0d34sy01gXlJjc16C-ZTOdsQPj94X9NXSWabqo";

async function findOutlets() {

  try {
    const ids = document.getElementById("ids").value
      .split(/[\s,]+/)
      .map(x => x.trim())
      .filter(x => x !== "");

    const res = await fetch(`https://opensheet.elk.sh/${SHEET_ID}/location`);
    const data = await res.json();

    const filtered = data.filter(d =>
      ids.includes(String(d["Outlet Id"]))
    );

    if (!filtered.length) {
      alert("No matching Outlet IDs found");
      return;
    }

    navigator.geolocation.getCurrentPosition(pos => {

      const userLat = pos.coords.latitude;
      const userLon = pos.coords.longitude;

      function getDistance(lat1, lon1, lat2, lon2) {
        const R = 6371;
        const dLat = (lat2 - lat1) * Math.PI/180;
        const dLon = (lon2 - lon1) * Math.PI/180;

        const a = Math.sin(dLat/2)**2 +
          Math.cos(lat1*Math.PI/180) *
          Math.cos(lat2*Math.PI/180) *
          Math.sin(dLon/2)**2;

        return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      }

      const result = filtered.map(o => ({
        name: o["Outlet Name"],
        address: o["Address"],
        link: o["Location"],   // ✅ FIXED
        distance: getDistance(
          userLat,
          userLon,
          parseFloat(o.Latitude),
          parseFloat(o.Longitude)
        )
      }));

      result.sort((a,b)=>a.distance-b.distance);

      const ul = document.getElementById("result");
      ul.innerHTML = "";

      result.forEach(r=>{
        const li = document.createElement("li");

        li.innerHTML = `
          <div class="name">${r.name}</div>
          <div class="address">${r.address || "No address"}</div>
          <div class="distance">Distance: ${r.distance.toFixed(2)} km</div>
          <a href="${r.link}" target="_blank">Open Location</a>
        `;

        ul.appendChild(li);
      });

    });

  } catch(e){
    alert("Error loading data");
  }
}
</script>

</body>
</html>
