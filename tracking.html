<!DOCTYPE html>
<html>
<head>
<title>Outlet Finder</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<style>
    body{font-family:Arial; margin:15px; background:#f9f9f9}
    .box{background:white; padding:15px; border-radius:8px; box-shadow:0 2px 5px rgba(0,0,0,0.1)}
    input{padding:12px; width:100%; margin-bottom:10px; border:1px solid #ddd; border-radius:5px; box-sizing:border-box}
    button{padding:12px 15px; cursor:pointer; background:#1a73e8; color:white; border:none; border-radius:5px; width:100%; margin-bottom:10px; font-weight:bold}
    #mapBtn{background:#34a853} #routeBtn{background:#fbbc05; color:black}
    ul{list-style:none; padding:0}
    li{margin-bottom:15px; padding:12px; border:1px solid #eee; border-radius:6px; background:#fff}
    .name{font-weight:bold; color:#1a73e8}
    #map{height:300px; margin-top:15px; border-radius:8px; display:none}
    #status{background:#d4edda; color:#155724; padding:10px; border-radius:5px; margin-bottom:10px; font-size:14px}
</style>
</head>
<body>
<div id="status">📡 Tracking Active (ID: <span id="uid"></span>)</div>
<div class="box">
    <h2>Find Outlets</h2>
    <input type="text" id="ids" placeholder="Enter Outlet IDs (e.g. 101, 102)">
    <button onclick="findOutlets()">Find & Track</button>
    <button id="mapBtn" style="display:none" onclick="showAllOnMap()">Show All on Map</button>
    <button id="routeBtn" style="display:none" onclick="openFullRoute()">Start Full Route</button>
    <ul id="result"></ul>
    <div id="map"></div>
</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbxTiAXI4kCsu4ZZafbBUyl2q_8AWIpvD0lmYHHvB4SBBjK-p9gq7o9E6_ObnQkFdvN2/exec";
const SHEET_ID="1u7RN-0d34sy01gXlJjc16C-ZTOdsQPj94X9NXSWabqo";
const urlParams = new URLSearchParams(window.location.search);
const empId = urlParams.get("id");

if(!empId || empId === "null") {
    alert("Session Error! Please login again.");
    window.location.href = "index.html";
} else {
    document.getElementById("uid").innerText = empId;
    // Real-time tracking
    setInterval(() => {
        navigator.geolocation.getCurrentPosition(pos => {
            fetch(`${API}?id=${encodeURIComponent(empId)}&lat=${pos.coords.latitude}&lng=${pos.coords.longitude}`);
        }, null, {enableHighAccuracy:true});
    }, 15000);
}

let outletsData=[], map;

async function findOutlets() {
    const rawIds = document.getElementById("ids").value;
    if(!rawIds) return alert("Please enter Outlet IDs");
    
    const ids = rawIds.split(/[\s,]+/).map(x=>x.trim()).filter(x=>x!=="");

    // MOBILE FIX: Pehle GPS call, phir data fetch
    navigator.geolocation.getCurrentPosition(async (pos) => {
        const userLat = pos.coords.latitude;
        const userLon = pos.coords.longitude;

        try {
            const res = await fetch(`https://opensheet.elk.sh/${SHEET_ID}/location`);
            const data = await res.json();
            const filtered = data.filter(d => ids.includes(String(d["Outlet Id"])));

            if(!filtered.length) return alert("No matching IDs found in Sheet");

            function getDistance(lat1,lon1,lat2,lon2){
                const R=6371; 
                const dLat=(lat2-lat1)*Math.PI/180;
                const dLon=(lon2-lon1)*Math.PI/180;
                const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
                return 2*R*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
            }

            outletsData = filtered.map(o => ({
                name: o["Outlet Name"],
                address: o["Address"],
                lat: parseFloat(o.Latitude),
                lng: parseFloat(o.Longitude),
                link: o["Location"],
                dist: getDistance(userLat, userLon, parseFloat(o.Latitude), parseFloat(o.Longitude))
            }));

            const ul = document.getElementById("result");
            ul.innerHTML = "";
            outletsData.forEach(r => {
                const li = document.createElement("li");
                li.innerHTML = `<div class="name">${r.name}</div><div>${r.address||""}</div><div><b>Distance:</b> ${r.dist.toFixed(2)} km</div><a href="${r.link}" target="_blank">Google Maps Link</a>`;
                ul.appendChild(li);
            });

            document.getElementById("mapBtn").style.display="block";
            document.getElementById("routeBtn").style.display="block";
            
        } catch(e) { alert("Error loading sheet data: " + e.message); }
    }, (err) => alert("Please allow GPS access for mobile to work!"), {enableHighAccuracy:true});
}

function showAllOnMap() {
    document.getElementById("map").style.display="block";
    navigator.geolocation.getCurrentPosition(pos => {
        const {latitude:lat, longitude:lng} = pos.coords;
        if(!map) {
            map = L.map('map').setView([lat, lng], 13);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        }
        L.marker([lat, lng]).addTo(map).bindPopup("Current Location").openPopup();
        outletsData.forEach(o => {
            if(o.lat && o.lng) L.marker([o.lat, o.lng]).addTo(map).bindTooltip(o.name, {permanent:true});
        });
    });
}

function openFullRoute() {
    navigator.geolocation.getCurrentPosition(pos => {
        let points = [`${pos.coords.latitude},${pos.coords.longitude}`];
        outletsData.forEach(o => points.push(`${o.lat},${o.lng}`));
        window.open("https://www.google.com/maps/dir/" + points.join("/"), "_blank");
    });
}
</script>
</body>
</html>
