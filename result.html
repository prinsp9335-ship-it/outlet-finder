<!DOCTYPE html>
<html>
<head>
  <title>Outlet Details</title>
</head>
<body>

<h2>Outlet Details</h2>

<p><b>Outlet ID:</b> <span id="id"></span></p>
<p><b>Outlet Name:</b> <span id="name"></span></p>
<p><b>Mobile Number:</b> <span id="mobile"></span></p>
<p><b>Address:</b> <span id="Address"></span></p>
<p><b>Location:</b> <a id="location" target="_blank">Open Map</a></p>

<h3>
  <a href="index.html">Go Back</a>
</h3>

<script>

const id = new URLSearchParams(window.location.search).get("id");
document.getElementById("id").innerText = id;

fetch("https://opensheet.elk.sh/1u7RN-0d34sy01gXlJjc16C-ZTOdsQPj94X9NXSWabqo/location")
.then(res => res.json())
.then(data => {

  const found = data.find(r => String(r["Outlet Id"]) === id);

  if(found){
    document.getElementById("name").innerText = found["Outlet Name"];
    document.getElementById("mobile").innerText =
      found["Phone Num"] || found["Mobile"] || "N/A";

    document.getElementById("Address").innerText =
      found["Address"] || "N/A";

    document.getElementById("location").href =
      found["Location"];   // ✅ FIXED
  } else {
    alert("Outlet not found");
  }

});
</script>

</body>
</html>
